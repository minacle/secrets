name: Build, test, and release

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  SWIFT_VERSION: 6.3.3
  VG_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
  VG_COMMIT: ${{ github.sha }}

jobs:
  build:
    name: ${{ matrix.platform }} ${{ matrix.architecture }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            platform: macos
            architecture: x86_64
            file_architecture: x86_64
            artifact: secrets-macos-x86_64
          - os: macos-15
            platform: macos
            architecture: arm64
            file_architecture: arm64
            artifact: secrets-macos-arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Select Xcode 26.3
        run: sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer

      - name: Cache Swiftly toolchain
        uses: actions/cache@v5
        with:
          path: |
            ~/.swiftly
            ~/Library/Developer/Toolchains/swift-${{ env.SWIFT_VERSION }}-RELEASE.xctoolchain
          key: swiftly-${{ runner.os }}-${{ runner.arch }}-${{ env.SWIFT_VERSION }}-v1

      - name: Install Swiftly and Swift ${{ env.SWIFT_VERSION }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL \
            "https://download.swift.org/swiftly/darwin/swiftly.pkg" \
            -o "${RUNNER_TEMP}/swiftly.pkg"
          installer \
            -pkg "${RUNNER_TEMP}/swiftly.pkg" \
            -target CurrentUserHomeDirectory
          _swiftly_executable="${HOME}/.swiftly/bin/swiftly"
          _swiftly_environment="${SWIFTLY_HOME_DIR:-$HOME/.swiftly}/env.sh"

          "${_swiftly_executable}" init \
            --assume-yes \
            --no-modify-profile \
            --skip-install \
            --quiet-shell-followup
          # shellcheck source=/dev/null
          source "${_swiftly_environment}"
          _post_install_file="${SWIFTLY_HOME_DIR}/post-install.sh"
          swiftly install "${SWIFT_VERSION}" \
            --assume-yes \
            --post-install-file="${_post_install_file}"
          if test -s "${_post_install_file}"; then
            bash "${_post_install_file}"
          fi
          dirname "$(command -v swiftly)" >> "${GITHUB_PATH}"

      - name: Verify toolchain
        run: swiftly run swift --version +"${SWIFT_VERSION}"

      - name: Discover tests
        run: swiftly run swift test list --scratch-path .build-ci-tests +"${SWIFT_VERSION}"

      - name: Run complete test suite
        run: swiftly run swift test --scratch-path .build-ci-tests +"${SWIFT_VERSION}"

      - name: Build release executable
        run: >-
          swiftly run swift build
          --scratch-path .build-ci-release
          --configuration release
          +"${SWIFT_VERSION}"

      - name: Verify and package executable
        shell: bash
        run: |
          set -euo pipefail
          _binary_directory="$(swiftly run swift build \
            --scratch-path .build-ci-release \
            --configuration release \
            --show-bin-path \
            +"${SWIFT_VERSION}")"
          _binary_path="${_binary_directory}/secrets"
          test -x "${_binary_path}"
          "${_binary_path}" --help >/dev/null
          _version="$("${_binary_path}" --version)"
          if test "${GITHUB_REF_TYPE}" = tag; then
            _expected_version="${GITHUB_REF_NAME#v}"
            test "${_version}" = "${_expected_version}"
          else
            case "${_version}" in
              dev+*) ;;
              *) echo "Unexpected development version: ${_version}" >&2; exit 1 ;;
            esac
          fi
          _file_output="$(file "${_binary_path}")"
          echo "${_file_output}"
          printf '%s\n' "${_file_output}" | grep -Fq "${{ matrix.file_architecture }}"
          mkdir -p artifacts
          _archive="artifacts/${{ matrix.artifact }}.tar.gz"
          tar -czf "${_archive}" -C "${_binary_directory}" secrets
          tar -tzf "${_archive}" | grep -Fxq secrets

      - name: Upload packaged executable
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/${{ matrix.artifact }}.tar.gz
          if-no-files-found: error

  notarize:
    name: Notarize universal macOS package
    if: github.ref_type == 'tag'
    needs: build
    runs-on: macos-15
    timeout-minutes: 60
    environment: release
    permissions:
      contents: read

    steps:
      - name: Select Xcode 26.3
        run: sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer

      - name: Download architecture-specific executables
        uses: actions/download-artifact@v8
        with:
          pattern: secrets-macos-*
          path: input
          merge-multiple: true

      - name: Import Developer ID certificates
        shell: bash
        env:
          APPLICATION_CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_BASE64 }}
          APPLICATION_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_PASSWORD }}
          INSTALLER_CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_INSTALLER_BASE64 }}
          INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_INSTALLER_PASSWORD }}
        run: |
          set -euo pipefail
          : "${APPLICATION_CERTIFICATE_BASE64:?Missing Developer ID Application certificate}"
          : "${APPLICATION_CERTIFICATE_PASSWORD:?Missing Developer ID Application password}"
          : "${INSTALLER_CERTIFICATE_BASE64:?Missing Developer ID Installer certificate}"
          : "${INSTALLER_CERTIFICATE_PASSWORD:?Missing Developer ID Installer password}"

          _keychain_path="${RUNNER_TEMP}/secrets-signing.keychain-db"
          _keychain_password="$(openssl rand -hex 32)"
          _application_certificate="${RUNNER_TEMP}/developer-id-application.p12"
          _installer_certificate="${RUNNER_TEMP}/developer-id-installer.p12"

          printf '%s' "${APPLICATION_CERTIFICATE_BASE64}" \
            | base64 --decode > "${_application_certificate}"
          printf '%s' "${INSTALLER_CERTIFICATE_BASE64}" \
            | base64 --decode > "${_installer_certificate}"

          security create-keychain -p "${_keychain_password}" "${_keychain_path}"
          security set-keychain-settings -lut 21600 "${_keychain_path}"
          security unlock-keychain -p "${_keychain_password}" "${_keychain_path}"
          security import "${_application_certificate}" \
            -k "${_keychain_path}" \
            -P "${APPLICATION_CERTIFICATE_PASSWORD}" \
            -x \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security import "${_installer_certificate}" \
            -k "${_keychain_path}" \
            -P "${INSTALLER_CERTIFICATE_PASSWORD}" \
            -x \
            -T /usr/bin/productsign \
            -T /usr/bin/security
          security list-keychains -d user -s "${_keychain_path}"
          security default-keychain -d user -s "${_keychain_path}"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "${_keychain_password}" \
            "${_keychain_path}"

          _application_identity="$(
            security find-identity -v -p codesigning "${_keychain_path}" \
              | awk '/"Developer ID Application:/ { print $2; exit }'
          )"
          _installer_identity="$(
            security find-identity -v -p basic "${_keychain_path}" \
              | awk '/"Developer ID Installer:/ { print $2; exit }'
          )"
          test -n "${_application_identity}"
          test -n "${_installer_identity}"

          {
            echo "MACOS_APPLICATION_IDENTITY=${_application_identity}"
            echo "MACOS_INSTALLER_IDENTITY=${_installer_identity}"
          } >> "${GITHUB_ENV}"

          rm -f "${_application_certificate}" "${_installer_certificate}"

      - name: Create and sign universal installer package
        shell: bash
        run: |
          set -euo pipefail
          _package_directory="${RUNNER_TEMP}/secrets-package"
          _arm64_directory="${_package_directory}/arm64"
          _x86_64_directory="${_package_directory}/x86_64"
          _package_root="${_package_directory}/root"
          _binary_path="${_package_directory}/secrets"
          _installed_binary="${_package_root}/usr/local/bin/secrets"
          _unsigned_package="${_package_directory}/unsigned.pkg"
          _signed_package="artifacts/secrets.pkg"
          _version="${GITHUB_REF_NAME#v}"

          mkdir -p \
            "${_arm64_directory}" \
            "${_x86_64_directory}" \
            "${_package_root}/usr/local/bin" \
            artifacts \
            notarization
          tar -xzf input/secrets-macos-arm64.tar.gz -C "${_arm64_directory}"
          tar -xzf input/secrets-macos-x86_64.tar.gz -C "${_x86_64_directory}"
          test -x "${_arm64_directory}/secrets"
          test -x "${_x86_64_directory}/secrets"
          file "${_arm64_directory}/secrets" | grep -Fq arm64
          file "${_x86_64_directory}/secrets" | grep -Fq x86_64

          lipo -create \
            -output "${_binary_path}" \
            "${_arm64_directory}/secrets" \
            "${_x86_64_directory}/secrets"
          test -x "${_binary_path}"
          lipo "${_binary_path}" -verify_arch arm64
          lipo "${_binary_path}" -verify_arch x86_64
          lipo "${_binary_path}" -archs

          codesign \
            --force \
            --identifier moe.minacle.secrets \
            --options runtime \
            --timestamp \
            --sign "${MACOS_APPLICATION_IDENTITY}" \
            --keychain "${RUNNER_TEMP}/secrets-signing.keychain-db" \
            "${_binary_path}"
          codesign --verify --strict --verbose=2 "${_binary_path}"
          codesign --display --verbose=4 "${_binary_path}"

          install -m 0755 "${_binary_path}" "${_installed_binary}"
          sudo -n xattr -rd com.apple.provenance "${_package_root}" 2>/dev/null || true
          xattr -cr "${_package_root}" 2>/dev/null || true
          codesign --verify --strict --verbose=2 "${_installed_binary}"
          pkgbuild \
            --root "${_package_root}" \
            --identifier moe.minacle.secrets \
            --version "${_version}" \
            --install-location / \
            --ownership recommended \
            "${_unsigned_package}"
          productsign \
            --sign "${MACOS_INSTALLER_IDENTITY}" \
            "${_unsigned_package}" \
            "${_signed_package}"
          pkgutil --check-signature "${_signed_package}"
          _payload="$(pkgutil --payload-files "${_signed_package}")"
          grep -Eq '^\.?/?usr/local/bin/secrets$' <<< "${_payload}"
          if grep -Eq '(^|/)\._' <<< "${_payload}"; then
            echo "Installer payload contains AppleDouble metadata" >&2
            exit 1
          fi
          rm -f "${_unsigned_package}"

      - name: Submit installer package for notarization
        shell: bash
        env:
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
          NOTARY_API_KEY_BASE64: ${{ secrets.NOTARY_API_KEY_BASE64 }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
        run: |
          set -euo pipefail
          : "${NOTARY_API_ISSUER_ID:?Missing Notary API issuer ID}"
          : "${NOTARY_API_KEY_BASE64:?Missing Notary API key}"
          : "${NOTARY_API_KEY_ID:?Missing Notary API key ID}"

          _package="artifacts/secrets.pkg"
          _notary_key="${RUNNER_TEMP}/AuthKey.p8"
          _response="notarization/secrets-macos-universal-response.json"
          _log="notarization/secrets-macos-universal-log.json"
          _submit_errors="notarization/secrets-macos-universal-submit.log"
          trap 'rm -f "${_notary_key}"' EXIT HUP INT TERM

          printf '%s' "${NOTARY_API_KEY_BASE64}" \
            | base64 --decode > "${_notary_key}"
          chmod 600 "${_notary_key}"

          _submit_exit_code=0
          xcrun notarytool submit "${_package}" \
            --key "${_notary_key}" \
            --key-id "${NOTARY_API_KEY_ID}" \
            --issuer "${NOTARY_API_ISSUER_ID}" \
            --wait \
            --timeout 45m \
            --output-format json \
            > "${_response}" 2> "${_submit_errors}" \
            || _submit_exit_code=$?
          cat "${_response}"
          if test -s "${_submit_errors}"; then
            cat "${_submit_errors}" >&2
          fi

          _submission_id="$(
            plutil -extract id raw -o - "${_response}" 2>/dev/null || true
          )"
          _notary_status="$(
            plutil -extract status raw -o - "${_response}" 2>/dev/null || true
          )"
          if test -n "${_submission_id}"; then
            xcrun notarytool log "${_submission_id}" "${_log}" \
              --key "${_notary_key}" \
              --key-id "${NOTARY_API_KEY_ID}" \
              --issuer "${NOTARY_API_ISSUER_ID}"
            cat "${_log}"
          fi
          if test "${_submit_exit_code}" -ne 0 || test "${_notary_status}" != Accepted; then
            echo "Notarization failed with status: ${_notary_status:-unknown}" >&2
            exit 1
          fi

      - name: Staple and inspect universal installer package
        shell: bash
        run: |
          set -euo pipefail
          _package="artifacts/secrets.pkg"

          xcrun stapler staple "${_package}"
          xcrun stapler validate "${_package}"
          pkgutil --check-signature "${_package}"
          spctl --assess --type install --verbose=4 "${_package}"

      - name: Upload notarized installer package
        uses: actions/upload-artifact@v7
        with:
          name: notarized-secrets-macos-universal
          path: artifacts/secrets.pkg
          if-no-files-found: error

      - name: Upload notarization records
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: notarization-records-secrets-macos-universal
          path: notarization/*
          if-no-files-found: ignore

      - name: Remove temporary signing keychain
        if: always()
        shell: bash
        run: |
          security delete-keychain "${RUNNER_TEMP}/secrets-signing.keychain-db" 2>/dev/null || true
          rm -f \
            "${RUNNER_TEMP}/developer-id-application.p12" \
            "${RUNNER_TEMP}/developer-id-installer.p12" \
            "${RUNNER_TEMP}/AuthKey.p8"

  verify-installer:
    name: Verify universal installer on ${{ matrix.architecture }}
    if: github.ref_type == 'tag'
    needs: notarize
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            architecture: x86_64
          - os: macos-15
            architecture: arm64

    steps:
      - name: Select Xcode 26.3
        run: sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer

      - name: Download notarized universal installer
        uses: actions/download-artifact@v8
        with:
          name: notarized-secrets-macos-universal
          path: artifacts

      - name: Install and verify universal executable
        shell: bash
        run: |
          set -euo pipefail
          _package="artifacts/secrets.pkg"
          _installed_binary="/usr/local/bin/secrets"
          _expected_version="${GITHUB_REF_NAME#v}"

          xcrun stapler validate "${_package}"
          pkgutil --check-signature "${_package}"
          spctl --assess --type install --verbose=4 "${_package}"
          sudo installer -pkg "${_package}" -target /

          test -x "${_installed_binary}"
          codesign --verify --strict --verbose=2 "${_installed_binary}"
          lipo "${_installed_binary}" -verify_arch arm64
          lipo "${_installed_binary}" -verify_arch x86_64
          test "$(uname -m)" = "${{ matrix.architecture }}"
          test "$("${_installed_binary}" --version)" = "${_expected_version}"
          test "$(stat -f '%Lp' "${_installed_binary}")" = 755
          test "$(stat -f '%Su:%Sg' "${_installed_binary}")" = root:wheel
          pkgutil --pkg-info moe.minacle.secrets
          test "$(
            pkgutil --pkg-info-plist moe.minacle.secrets \
              | plutil -extract pkg-version raw -o - -
          )" = "${_expected_version}"

  release:
    name: Publish GitHub Release
    if: github.ref_type == 'tag'
    needs: verify-installer
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download macOS artifacts
        uses: actions/download-artifact@v8
        with:
          name: notarized-secrets-macos-universal
          path: artifacts

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          _release_arguments=()
          case "${GITHUB_REF_NAME}" in
            *-*) _release_arguments+=(--prerelease) ;;
          esac
          gh release create "${GITHUB_REF_NAME}" \
            artifacts/*.pkg \
            --generate-notes \
            --verify-tag \
            "${_release_arguments[@]}"
